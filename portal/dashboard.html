<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — Fareless</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --orange: #FF5A1F;
    --orange-dark: #E8470F;
    --orange-light: #FF8C42;
    --peach: #FFF1E6;
    --ink: #191512;
    --ink-soft: #6B6259;
    --white: #FFFFFF;
    --line: #F0E3D8;
    --shadow: 0 20px 40px -20px rgba(232, 71, 15, 0.35);
    --error: #E8470F;
    --success: #2E9A57;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html { scroll-behavior:smooth; }

  body{
    font-family:'Inter', sans-serif;
    color:var(--ink);
    background:var(--white);
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
  }

  .blob{
    position:fixed;
    border-radius:50%;
    filter:blur(70px);
    opacity:0.3;
    z-index:0;
    pointer-events:none;
  }
  .blob-1{ width:480px; height:480px; background:var(--orange-light); top:-200px; right:-160px; }
  .blob-2{ width:360px; height:360px; background:var(--peach); bottom:-160px; left:-140px; opacity:0.8; }

  header{
    position:relative; z-index:20;
    display:flex; align-items:center; justify-content:space-between;
    padding: 24px 6vw;
  }
  .logo{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:1.4rem;
    letter-spacing:-0.02em;
    display:flex; align-items:center; gap:8px;
  }
  .logo .dot{
    width:9px; height:9px; border-radius:50%;
    background:var(--orange);
    display:inline-block;
    box-shadow:0 0 0 5px var(--peach);
  }
  .logo-link{ color:inherit; text-decoration:none; display:flex; align-items:center; gap:8px; }

  .header-right{ display:flex; align-items:center; gap:12px; }

  .user-pill{
    font-size:0.8rem;
    font-weight:600;
    color:var(--ink);
    background:var(--white);
    border:1.5px solid var(--line);
    padding:8px 16px;
    border-radius:999px;
    display:flex;
    align-items:center;
    gap:8px;
    max-width:220px;
  }
  .user-pill .avatar{
    width:22px; height:22px;
    border-radius:50%;
    background:var(--orange);
    color:var(--white);
    font-size:0.7rem;
    font-weight:700;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .user-pill .u-email{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .menu-wrap{ position:relative; }
  .hamburger-btn{
    display:flex; flex-direction:column; justify-content:center; align-items:center; gap:5px;
    width:42px; height:42px;
    border-radius:12px;
    border:1.5px solid var(--line);
    background:var(--white);
    cursor:pointer;
    transition: border-color .2s ease, background .2s ease;
  }
  .hamburger-btn:hover{ border-color:var(--orange-light); background:var(--peach); }
  .hamburger-btn span{
    display:block; width:18px; height:2px; border-radius:2px;
    background:var(--ink);
    transition: transform .25s ease, opacity .2s ease;
  }
  .hamburger-btn.open span:nth-child(1){ transform: translateY(7px) rotate(45deg); }
  .hamburger-btn.open span:nth-child(2){ opacity:0; }
  .hamburger-btn.open span:nth-child(3){ transform: translateY(-7px) rotate(-45deg); }

  .dropdown-menu{
    position:absolute; top:calc(100% + 10px); right:0;
    min-width:200px;
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:16px;
    box-shadow:0 20px 40px -16px rgba(25,21,18,0.22);
    padding:10px;
    opacity:0; transform:translateY(-6px);
    pointer-events:none;
    transition: opacity .18s ease, transform .18s ease;
  }
  .dropdown-menu.show{ opacity:1; transform:translateY(0); pointer-events:auto; }
  .dropdown-menu a, .dropdown-menu button.menu-item{
    display:flex; align-items:center; gap:10px;
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    text-decoration:none;
    color:var(--ink);
    font-weight:500;
    font-size:0.9rem;
    background:none;
    border:none;
    box-shadow:none;
    cursor:pointer;
    text-align:left;
    font-family:'Inter', sans-serif;
    transition: background .15s ease, color .15s ease;
  }
  .dropdown-menu a:hover, .dropdown-menu button.menu-item:hover{ background:var(--peach); color:var(--orange-dark); }
  .dropdown-menu .menu-icon{ width:20px; text-align:center; flex-shrink:0; }
  .dropdown-menu .divider-line{ height:1px; background:var(--line); margin:6px 4px; }

  main{
    position:relative; z-index:2;
    max-width:920px;
    margin:0 auto;
    padding: 1vh 6vw 8vh;
  }

  .page-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
    margin-bottom:28px;
  }
  .page-head h1{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:clamp(1.7rem, 4vw, 2.3rem);
    letter-spacing:-0.02em;
    margin-bottom:6px;
  }
  .page-head p{ color:var(--ink-soft); font-size:0.95rem; }

  button.primary-btn{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:0.92rem;
    color:var(--white);
    background:var(--orange);
    border:none;
    padding:13px 22px;
    border-radius:14px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition: transform .15s ease, background .2s ease;
    display:inline-flex;
    align-items:center;
    gap:8px;
    white-space:nowrap;
  }
  button.primary-btn:hover{ background:var(--orange-dark); transform:translateY(-2px); }
  button.primary-btn:active{ transform:translateY(0); }

  /* Stats row */
  .stats-row{
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:14px;
    margin-bottom:34px;
  }
  .stat-card{
    background:var(--peach);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:18px 20px;
  }
  .stat-card .stat-label{
    font-size:0.74rem;
    font-weight:600;
    letter-spacing:0.04em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:6px;
  }
  .stat-card .stat-value{
    font-family:'JetBrains Mono', monospace;
    font-size:1.5rem;
    font-weight:700;
    color:var(--orange-dark);
  }

  /* Journey list */
  .list-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:14px;
  }
  .list-head h2{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:1.15rem;
  }

  .journey-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }

  .journey-card{
    background:var(--white);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:18px 20px;
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .journey-card:hover{ border-color:var(--orange-light); box-shadow:0 10px 24px -18px rgba(232,71,15,0.4); }

  .mode-chip{
    width:44px; height:44px;
    border-radius:12px;
    background:var(--peach);
    border:1.5px solid var(--orange-light);
    display:flex; align-items:center; justify-content:center;
    font-size:19px;
    flex-shrink:0;
  }

  .journey-main{ flex:1; min-width:180px; }
  .journey-mode-name{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:1rem;
    margin-bottom:3px;
  }
  .journey-time{
    font-size:0.82rem;
    color:var(--ink-soft);
  }

  .journey-metrics{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
  }
  .metric{
    text-align:left;
    min-width:64px;
  }
  .metric .m-label{
    font-size:0.68rem;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color:var(--ink-soft);
    margin-bottom:2px;
  }
  .metric .m-value{
    font-family:'JetBrains Mono', monospace;
    font-size:0.9rem;
    font-weight:600;
    color:var(--ink);
  }

  .status-badge{
    font-size:0.7rem;
    font-weight:600;
    padding:4px 10px;
    border-radius:999px;
    background:var(--peach);
    color:var(--orange-dark);
    white-space:nowrap;
  }
  .status-badge.inactive{
    background:#F0EEEC;
    color:var(--ink-soft);
  }

  .journey-actions{
    display:flex;
    gap:8px;
    margin-left:auto;
  }
  .icon-btn{
    width:36px; height:36px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--white);
    color:var(--ink-soft);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:none;
    transition: border-color .15s ease, color .15s ease, background .15s ease;
  }
  .icon-btn svg{ width:16px; height:16px; }
  .icon-btn:hover{ border-color:var(--orange-light); color:var(--orange-dark); background:var(--peach); transform:none; }
  .icon-btn.danger:hover{ border-color:var(--error); color:var(--error); background:#FFF0EC; }
  .icon-btn.confirming{
    background:var(--error);
    border-color:var(--error);
    color:var(--white);
    width:auto;
    padding:0 12px;
    font-size:0.76rem;
    font-weight:600;
    font-family:'Inter', sans-serif;
    gap:6px;
  }

  .empty-state{
    text-align:center;
    padding:60px 20px;
    border:1.5px dashed var(--line);
    border-radius:20px;
    color:var(--ink-soft);
  }
  .empty-state .emoji{ font-size:2.2rem; margin-bottom:10px; }
  .empty-state h3{
    font-family:'Fredoka', sans-serif;
    color:var(--ink);
    margin-bottom:6px;
    font-size:1.05rem;
  }

  .loading-state{
    text-align:center;
    padding:50px 20px;
    color:var(--ink-soft);
    font-size:0.9rem;
  }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(25,21,18,0.45);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease;
  }
  .modal-overlay.show{ opacity:1; pointer-events:auto; }

  .modal-card{
    background:var(--white);
    border-radius:22px;
    width:100%;
    max-width:480px;
    max-height:88vh;
    overflow-y:auto;
    padding:30px 30px 26px;
    transform:translateY(12px);
    transition:transform .2s ease;
  }
  .modal-overlay.show .modal-card{ transform:translateY(0); }

  .modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }
  .modal-head h2{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:1.25rem;
  }
  .modal-close{
    width:34px; height:34px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--white);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft);
    box-shadow:none;
  }
  .modal-close:hover{ border-color:var(--orange-light); color:var(--orange-dark); background:var(--peach); transform:none; }

  .field{ margin-bottom:16px; }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .field label{
    display:block;
    font-size:0.8rem;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }
  .field .hint{
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-top:4px;
  }
  input, select{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:2px solid var(--line);
    font-family:'Inter', sans-serif;
    font-size:0.9rem;
    outline:none;
    background:var(--white);
    color:var(--ink);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  input:focus, select:focus{
    border-color:var(--orange);
    box-shadow:0 0 0 4px rgba(255,90,31,0.12);
  }
  input.error, select.error{ border-color:var(--error); }

  .checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:18px;
  }
  .checkbox-row input[type="checkbox"]{
    width:16px; height:16px;
    accent-color:var(--orange);
    cursor:pointer;
  }
  .checkbox-row label{ font-size:0.85rem; color:var(--ink); font-weight:500; cursor:pointer; }

  .advanced-toggle{
    background:none;
    border:none;
    box-shadow:none;
    padding:0;
    color:var(--orange-dark);
    font-size:0.82rem;
    font-weight:600;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    margin-bottom:14px;
  }
  .advanced-toggle:hover{ transform:none; background:none; text-decoration:underline; }
  .advanced-fields{ display:none; }
  .advanced-fields.show{ display:block; }

  .modal-msg{
    font-size:0.83rem;
    font-weight:600;
    color:var(--error);
    margin-bottom:12px;
    min-height:16px;
  }

  .modal-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .modal-actions button.primary-btn{ flex:1; justify-content:center; }
  .modal-actions .spinner{
    width:15px; height:15px;
    border-radius:50%;
    border:2.5px solid rgba(255,255,255,0.45);
    border-top-color:var(--white);
    animation: spin .7s linear infinite;
    display:none;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  button.loading .spinner{ display:inline-block; }

  @media (max-width:640px){
    .stats-row{ grid-template-columns:1fr; }
    .field-row{ grid-template-columns:1fr; }
    .journey-card{ padding:16px; }
    .journey-actions{ margin-left:0; width:100%; justify-content:flex-end; }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<header>
  <a href="https://fareless.app" class="logo-link">
    <span class="logo"><span class="dot"></span>Fareless</span>
  </a>

  <div class="header-right">
    <div class="user-pill" id="user-pill" style="display:none;">
      <span class="avatar" id="user-avatar">–</span>
      <span class="u-email" id="user-email"></span>
    </div>

    <div class="menu-wrap">
      <button class="hamburger-btn" id="hamburger-btn" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="dropdown-menu" id="dropdown-menu">
        <a href="/calculator/"><span class="menu-icon">🧮</span>Tourist Calculator</a>
        <a href="/Edinburgh Travel/"><span class="menu-icon">>>/span>Edinburgh Travel</a>
        <div class="divider-line"></div>
        <button type="button" class="menu-item" id="logout-btn"><span class="menu-icon">↩️</span>Log out</button>
      </nav>
    </div>
  </div>
</header>

<main>
  <div class="page-head">
    <div>
      <h1>Your journeys</h1>
      <p>Every ride you've logged, and what it actually cost.</p>
    </div>
    <button class="primary-btn" id="add-journey-btn">+ Log a journey</button>
  </div>

  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total journeys</div>
      <div class="stat-value" id="stat-count">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total spent</div>
      <div class="stat-value" id="stat-cost">–</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total distance</div>
      <div class="stat-value" id="stat-distance">–</div>
    </div>
  </div>

  <div class="list-head">
    <h2>Recent activity</h2>
  </div>

  <div id="list-container">
    <div class="loading-state">Loading your journeys…</div>
  </div>
</main>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="modal-title">Log a journey</h2>
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
    </div>

    <form id="journey-form" novalidate>
      <div class="field">
        <label for="mode-select">Transport mode</label>
        <select id="mode-select" required>
          <option value="">Select a mode…</option>
        </select>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="journey-start">Start time</label>
          <input type="datetime-local" id="journey-start" required>
        </div>
        <div class="field">
          <label for="journey-end">End time</label>
          <input type="datetime-local" id="journey-end">
        </div>
      </div>

      <div class="field-row">
        <div class="field">
          <label for="cost">Cost (£)</label>
          <input type="number" id="cost" step="0.01" min="0" placeholder="0.00">
        </div>
        <div class="field">
          <label for="travel-minutes">Duration (min)</label>
          <input type="number" id="travel-minutes" step="1" min="0" placeholder="0">
        </div>
      </div>

      <div class="field">
        <label for="distance-meters">Distance (metres)</label>
        <input type="number" id="distance-meters" step="1" min="0" placeholder="0">
      </div>

      <div class="checkbox-row" id="active-row" style="display:none;">
        <input type="checkbox" id="is-active" checked>
        <label for="is-active">Active journey record</label>
      </div>

      <button type="button" class="advanced-toggle" id="advanced-toggle">
        <span id="advanced-arrow">▸</span> Advanced: coordinates & network nodes
      </button>
      <div class="advanced-fields" id="advanced-fields">
        <div class="field-row">
          <div class="field">
            <label for="start-lat">Start latitude</label>
            <input type="number" id="start-lat" step="0.000001">
          </div>
          <div class="field">
            <label for="start-long">Start longitude</label>
            <input type="number" id="start-long" step="0.000001">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="end-lat">End latitude</label>
            <input type="number" id="end-lat" step="0.000001">
          </div>
          <div class="field">
            <label for="end-long">End longitude</label>
            <input type="number" id="end-long" step="0.000001">
          </div>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="start-node">Start node ID</label>
            <input type="number" id="start-node" step="1">
          </div>
          <div class="field">
            <label for="end-node">End node ID</label>
            <input type="number" id="end-node" step="1">
          </div>
        </div>
      </div>

      <div class="modal-msg" id="modal-msg"></div>

      <div class="modal-actions">
        <button type="submit" class="primary-btn" id="save-btn">
          <span class="spinner"></span>
          <span id="save-btn-label">Save journey</span>
        </button>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js'

const supabaseUrl = 'https://tjtccacswjvmpcsczosd.supabase.co'
const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRqdGNjYWNzd2p2bXBjc2N6b3NkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMzA5NzYsImV4cCI6MjEwMTcwNjk3Nn0.VhF0imXq1wQ0kpJnI9w1rwJeMkKmlmjQeC25W31vbtc'
const supabase = createClient(supabaseUrl, supabaseKey)

let currentUser = null
let modesById = {}
let journeysCache = []
let editingJourneyId = null // null = add mode

// ---------- Icons per transport type (best-effort match on keywords) ----------
function iconForMode(transportType) {
  const t = (transportType || '').toLowerCase()
  if (t.includes('tram')) return '🚊'
  if (t.includes('bus')) return '🚌'
  if (t.includes('bike') || t.includes('cycle') || t.includes('scooter') || t.includes('voi')) return '🛴'
  if (t.includes('train') || t.includes('rail')) return '🚆'
  if (t.includes('taxi') || t.includes('cab')) return '🚕'
  if (t.includes('car')) return '🚗'
  if (t.includes('walk')) return '🚶'
  if (t.includes('ferry') || t.includes('boat')) return '⛴️'
  if (t.includes('plane') || t.includes('flight') || t.includes('air')) return '✈️'
  return '📍'
}

// ---------- Auth guard ----------
async function initAuth() {
  const { data: { session } } = await supabase.auth.getSession()
  if (!session) {
    window.location.href = 'login.html'
    return null
  }
  return session.user
}

function renderUserPill(user) {
  const pill = document.getElementById('user-pill')
  const emailEl = document.getElementById('user-email')
  const avatarEl = document.getElementById('user-avatar')
  const email = user.email || 'Account'
  emailEl.textContent = email
  avatarEl.textContent = email.charAt(0).toUpperCase()
  pill.style.display = 'flex'
}

// ---------- Load transport modes ----------
async function loadModes() {
  const { data, error } = await supabase
    .from('transport_modes')
    .select('mode_id, transport_type, region')
    .eq('is_active', true)
    .order('transport_type', { ascending: true })

  const select = document.getElementById('mode-select')

  if (error) {
    console.error(error)
    return
  }

  modesById = {}
  data.forEach(mode => {
    modesById[mode.mode_id] = mode
    const opt = document.createElement('option')
    opt.value = mode.mode_id
    opt.textContent = mode.region ? `${mode.transport_type} — ${mode.region}` : mode.transport_type
    select.appendChild(opt)
  })
}

// ---------- Formatting helpers ----------
function formatDateTime(iso) {
  if (!iso) return '—'
  const d = new Date(iso)
  return d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
}
function formatCost(v) {
  if (v === null || v === undefined) return '—'
  return '£' + Number(v).toFixed(2)
}
function formatDistance(m) {
  if (m === null || m === undefined) return '—'
  return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : m + ' m'
}
function formatDuration(min) {
  if (min === null || min === undefined) return '—'
  if (min < 60) return min + ' min'
  const h = Math.floor(min / 60)
  const rem = min % 60
  return rem ? `${h}h ${rem}m` : `${h}h`
}
function toDatetimeLocalValue(iso) {
  if (!iso) return ''
  const d = new Date(iso)
  const pad = n => String(n).padStart(2, '0')
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`
}

// ---------- Load & render journeys ----------
async function loadJourneys() {
  const container = document.getElementById('list-container')
  const { data, error } = await supabase
    .from('user_journeys')
    .select('*, transport_modes(transport_type, region)')
    .order('journey_start', { ascending: false })

  if (error) {
    console.error(error)
    container.innerHTML = `<div class="empty-state"><div class="emoji">⚠️</div><h3>Couldn't load journeys</h3><p>${error.message}</p></div>`
    return
  }

  journeysCache = data || []
  renderStats(journeysCache)
  renderJourneyList(journeysCache)
}

function renderStats(journeys) {
  const count = journeys.length
  const totalCost = journeys.reduce((sum, j) => sum + (Number(j.cost) || 0), 0)
  const totalDistance = journeys.reduce((sum, j) => sum + (Number(j.distance_meters) || 0), 0)

  document.getElementById('stat-count').textContent = count
  document.getElementById('stat-cost').textContent = '£' + totalCost.toFixed(2)
  document.getElementById('stat-distance').textContent = totalDistance >= 1000
    ? (totalDistance / 1000).toFixed(1) + ' km'
    : totalDistance + ' m'
}

function renderJourneyList(journeys) {
  const container = document.getElementById('list-container')

  if (!journeys.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="emoji">🧭</div>
        <h3>No journeys yet</h3>
        <p>Log your first ride to start tracking what it really costs.</p>
      </div>`
    return
  }

  const list = document.createElement('div')
  list.className = 'journey-list'

  journeys.forEach(j => {
    const modeInfo = j.transport_modes || {}
    const card = document.createElement('div')
    card.className = 'journey-card'
    card.dataset.id = j.journey_id

    card.innerHTML = `
      <div class="mode-chip">${iconForMode(modeInfo.transport_type)}</div>
      <div class="journey-main">
        <div class="journey-mode-name">${escapeHtml(modeInfo.transport_type || 'Unknown mode')}</div>
        <div class="journey-time">${formatDateTime(j.journey_start)}${j.journey_end ? ' → ' + formatDateTime(j.journey_end) : ''}</div>
      </div>
      <div class="journey-metrics">
        <div class="metric"><div class="m-label">Cost</div><div class="m-value">${formatCost(j.cost)}</div></div>
        <div class="metric"><div class="m-label">Duration</div><div class="m-value">${formatDuration(j.travel_minutes)}</div></div>
        <div class="metric"><div class="m-label">Distance</div><div class="m-value">${formatDistance(j.distance_meters)}</div></div>
      </div>
      <span class="status-badge ${j.is_active ? '' : 'inactive'}">${j.is_active ? 'Active' : 'Archived'}</span>
      <div class="journey-actions">
        <button class="icon-btn edit-btn" aria-label="Edit journey">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"></path></svg>
        </button>
        <button class="icon-btn danger delete-btn" aria-label="Delete journey">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>
        </button>
      </div>
    `

    card.querySelector('.edit-btn').addEventListener('click', () => openEditModal(j))
    card.querySelector('.delete-btn').addEventListener('click', (e) => handleDeleteClick(e.currentTarget, j.journey_id))

    list.appendChild(card)
  })

  container.innerHTML = ''
  container.appendChild(list)
}

function escapeHtml(str) {
  const div = document.createElement('div')
  div.textContent = str
  return div.innerHTML
}

// ---------- Delete with inline confirm ----------
function handleDeleteClick(btn, journeyId) {
  if (!btn.classList.contains('confirming')) {
    btn.classList.add('confirming')
    btn.innerHTML = 'Confirm delete?'
    btn.dataset.timeout = setTimeout(() => {
      btn.classList.remove('confirming')
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path></svg>`
    }, 3000)
    return
  }
  clearTimeout(btn.dataset.timeout)
  deleteJourney(journeyId)
}

async function deleteJourney(journeyId) {
  const { error } = await supabase.from('user_journeys').delete().eq('journey_id', journeyId)
  if (error) {
    alert('Could not delete journey: ' + error.message)
    return
  }
  await loadJourneys()
}

// ---------- Modal ----------
const overlay = document.getElementById('modal-overlay')
const form = document.getElementById('journey-form')
const modalTitle = document.getElementById('modal-title')
const modalMsg = document.getElementById('modal-msg')
const saveBtn = document.getElementById('save-btn')
const saveBtnLabel = document.getElementById('save-btn-label')
const activeRow = document.getElementById('active-row')

function openAddModal() {
  editingJourneyId = null
  modalTitle.textContent = 'Log a journey'
  saveBtnLabel.textContent = 'Save journey'
  form.reset()
  activeRow.style.display = 'none'
  modalMsg.textContent = ''
  clearFieldErrors()
  collapseAdvanced()
  overlay.classList.add('show')
}

function openEditModal(journey) {
  editingJourneyId = journey.journey_id
  modalTitle.textContent = 'Edit journey'
  saveBtnLabel.textContent = 'Update journey'
  modalMsg.textContent = ''
  clearFieldErrors()

  document.getElementById('mode-select').value = journey.mode_id
  document.getElementById('journey-start').value = toDatetimeLocalValue(journey.journey_start)
  document.getElementById('journey-end').value = toDatetimeLocalValue(journey.journey_end)
  document.getElementById('cost').value = journey.cost ?? ''
  document.getElementById('travel-minutes').value = journey.travel_minutes ?? ''
  document.getElementById('distance-meters').value = journey.distance_meters ?? ''
  document.getElementById('start-lat').value = journey.start_lat ?? ''
  document.getElementById('start-long').value = journey.start_long ?? ''
  document.getElementById('end-lat').value = journey.end_lat ?? ''
  document.getElementById('end-long').value = journey.end_long ?? ''
  document.getElementById('start-node').value = journey.start_node ?? ''
  document.getElementById('end-node').value = journey.end_node ?? ''
  document.getElementById('is-active').checked = !!journey.is_active

  activeRow.style.display = 'flex'

  const hasAdvanced = journey.start_lat || journey.start_long || journey.end_lat || journey.end_long || journey.start_node || journey.end_node
  if (hasAdvanced) expandAdvanced(); else collapseAdvanced()

  overlay.classList.add('show')
}

function closeModal() {
  overlay.classList.remove('show')
}

document.getElementById('add-journey-btn').addEventListener('click', openAddModal)
document.getElementById('modal-close').addEventListener('click', closeModal)
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal() })
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal() })

// Advanced fields toggle
const advancedFields = document.getElementById('advanced-fields')
const advancedArrow = document.getElementById('advanced-arrow')
function expandAdvanced() { advancedFields.classList.add('show'); advancedArrow.textContent = '▾' }
function collapseAdvanced() { advancedFields.classList.remove('show'); advancedArrow.textContent = '▸' }
document.getElementById('advanced-toggle').addEventListener('click', () => {
  advancedFields.classList.contains('show') ? collapseAdvanced() : expandAdvanced()
})

function clearFieldErrors() {
  document.querySelectorAll('#journey-form .error').forEach(el => el.classList.remove('error'))
}

// ---------- Form submit (insert or update) ----------
form.addEventListener('submit', async (e) => {
  e.preventDefault()
  clearFieldErrors()
  modalMsg.textContent = ''

  const modeSelect = document.getElementById('mode-select')
  const startInput = document.getElementById('journey-start')
  const endInput = document.getElementById('journey-end')

  if (!modeSelect.value) {
    modeSelect.classList.add('error')
    modalMsg.textContent = 'Choose a transport mode.'
    return
  }
  if (!startInput.value) {
    startInput.classList.add('error')
    modalMsg.textContent = 'Journey start time is required.'
    return
  }
  if (endInput.value && new Date(endInput.value) < new Date(startInput.value)) {
    endInput.classList.add('error')
    modalMsg.textContent = 'End time must be after the start time.'
    return
  }

  const payload = {
    mode_id: Number(modeSelect.value),
    journey_start: new Date(startInput.value).toISOString(),
    journey_end: endInput.value ? new Date(endInput.value).toISOString() : null,
    cost: numOrNull('cost'),
    travel_minutes: intOrNull('travel-minutes'),
    distance_meters: intOrNull('distance-meters'),
    start_lat: numOrNull('start-lat'),
    start_long: numOrNull('start-long'),
    end_lat: numOrNull('end-lat'),
    end_long: numOrNull('end-long'),
    start_node: intOrNull('start-node'),
    end_node: intOrNull('end-node'),
  }

  saveBtn.disabled = true
  saveBtn.classList.add('loading')

  let error
  if (editingJourneyId) {
    payload.is_active = document.getElementById('is-active').checked
    ;({ error } = await supabase.from('user_journeys').update(payload).eq('journey_id', editingJourneyId))
  } else {
    payload.user_id = currentUser.id
    ;({ error } = await supabase.from('user_journeys').insert(payload))
  }

  saveBtn.disabled = false
  saveBtn.classList.remove('loading')

  if (error) {
    modalMsg.textContent = error.message
    return
  }

  closeModal()
  await loadJourneys()
})

function numOrNull(id) {
  const v = document.getElementById(id).value
  return v === '' ? null : Number(v)
}
function intOrNull(id) {
  const v = document.getElementById(id).value
  return v === '' ? null : parseInt(v, 10)
}

// ---------- Hamburger menu ----------
const hamburgerBtn = document.getElementById('hamburger-btn')
const dropdownMenu = document.getElementById('dropdown-menu')
function closeMenu() {
  hamburgerBtn.classList.remove('open')
  hamburgerBtn.setAttribute('aria-expanded', 'false')
  dropdownMenu.classList.remove('show')
}
hamburgerBtn.addEventListener('click', (e) => {
  e.stopPropagation()
  const isOpen = dropdownMenu.classList.toggle('show')
  hamburgerBtn.classList.toggle('open', isOpen)
  hamburgerBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false')
})
document.addEventListener('click', (e) => { if (!e.target.closest('.menu-wrap')) closeMenu() })

document.getElementById('logout-btn').addEventListener('click', async () => {
  await supabase.auth.signOut()
  window.location.href = 'login.html'
})

// ---------- Init ----------
;(async function init() {
  currentUser = await initAuth()
  if (!currentUser) return
  renderUserPill(currentUser)
  await loadModes()
  await loadJourneys()
})()
</script>
